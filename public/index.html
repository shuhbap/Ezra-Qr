<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZR WhatsApp Bot</title>
<style>
:root{--bg:#050505;--card:#0b0f0d;--line:#17352a;--acc:#10b981;--txt:#e8f5ef;--mute:#7c8f87;--err:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:460px}
h1{font-size:24px;margin:8px 0 4px;letter-spacing:.5px}
h1 span{color:var(--acc)}
.sid{color:var(--mute);font-size:13px}.sid b{color:var(--txt);font-family:ui-monospace,Menlo,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
.st{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--err)}
.dot.connecting{background:var(--warn);animation:p 1s infinite}.dot.connected{background:var(--acc);box-shadow:0 0 10px var(--acc)}
@keyframes p{50%{opacity:.35}}
label{display:block;color:var(--mute);font-size:12px;margin:0 0 6px;text-transform:uppercase;letter-spacing:1px}
input{width:100%;background:#000;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px;font-size:16px;margin-bottom:12px}
input:focus{outline:none;border-color:var(--acc)}
button{width:100%;border:0;border-radius:10px;padding:13px;font-weight:700;letter-spacing:1px;cursor:pointer;background:var(--acc);color:#02130c;font-size:14px}
button:disabled{opacity:.5;cursor:wait}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--mute);margin-top:10px}
.code{font:700 34px ui-monospace,Menlo,monospace;letter-spacing:6px;text-align:center;color:var(--acc);margin:6px 0 10px;word-break:break-all}
.lbl{text-align:center;color:var(--mute);font-size:12px;letter-spacing:2px}
ol{margin:10px 0 0;padding-left:18px;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid div{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
.grid b{display:block;color:var(--txt);font-size:14px;text-transform:none;letter-spacing:0;margin-top:2px}
.msg{margin-top:10px;font-size:14px;min-height:20px}.msg.err{color:var(--err)}
.ok{text-align:center;color:var(--acc);font-weight:800;letter-spacing:3px;font-size:20px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>EZR <span>WhatsApp Bot</span></h1>
  <div class="sid">Session ID: <b id="sid">EZR4-4BH1</b></div>

  <div class="card"><div class="st"><span id="dot" class="dot"></span><span id="stxt">Disconnected</span></div></div>

  <div id="pairCard" class="card">
    <div id="keyBox" class="hide"><label for="key">Access key</label><input id="key" type="password" autocomplete="off"></div>
    <label for="num">WhatsApp number</label>
    <input id="num" type="tel" inputmode="tel" placeholder="+91 XXXXXXXXXX" autocomplete="off">
    <button id="go">GENERATE PAIRING CODE</button>
    <div id="msg" class="msg"></div>
    <div id="codeBox" class="hide">
      <div class="lbl">PAIRING CODE</div>
      <div id="code" class="code"></div>
      <ol><li>Open WhatsApp</li><li>Linked Devices</li><li>Link a Device</li><li>Link with phone number instead</li></ol>
    </div>
  </div>

  <div id="okCard" class="card hide"><div class="ok">CONNECTED</div>
    <button id="out" class="ghost">LOG OUT</button></div>

  <div class="card grid">
    <div>Session Status<b id="i1">–</b></div>
    <div>Connection Status<b id="i2">–</b></div>
    <div>Last Connected<b id="i3">–</b></div>
    <div>Reconnect Attempts<b id="i4">0</b></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const hdr = () => ($('key').value ? { 'x-access-key': $('key').value } : {});
const label = { connected: 'Connected', connecting: 'Connecting', disconnected: 'Disconnected' };

function render(d) {
  const st = d ? d.connectionStatus : 'disconnected';
  $('dot').className = 'dot ' + st;
  $('stxt').textContent = label[st] || 'Disconnected';
  $('i1').textContent = d && d.authenticated ? 'Authenticated' : 'Not authenticated';
  $('i2').textContent = label[st] || '–';
  $('i3').textContent = d && d.lastConnected ? new Date(d.lastConnected).toLocaleString() : '–';
  $('i4').textContent = d ? d.reconnectAttempts : '0';
  $('sid').textContent = d ? d.sessionId : 'EZR4-4BH1';
  $('keyBox').classList.toggle('hide', !(d && d.protected));
  const linked = !!(d && d.authenticated);
  $('pairCard').classList.toggle('hide', linked);
  $('okCard').classList.toggle('hide', !linked);
  if (d && !d.pairingActive) $('codeBox').classList.add('hide');
}
async function refresh() {
  try { render(await (await fetch('/status')).json()); } catch (_) { render(null); }
}
$('go').onclick = async () => {
  const digits = $('num').value.replace(/\D/g, '');
  const msg = $('msg'); msg.className = 'msg'; msg.textContent = '';
  if (digits.length < 8 || digits.length > 15) { msg.className = 'msg err'; msg.textContent = 'Enter your number with country code, e.g. +91 9876543210'; return; }
  $('go').disabled = true; msg.textContent = 'Requesting pairing code…';
  try {
    const r = await fetch('/pair?number=' + encodeURIComponent(digits), { headers: hdr() });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    $('code').textContent = d.pairingCode; $('codeBox').classList.remove('hide'); msg.textContent = '';
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
  $('go').disabled = false; refresh();
};
$('out').onclick = async () => {
  if (!confirm('Log out and remove the saved session?')) return;
  await fetch('/logout', { method: 'POST', headers: hdr() }); refresh();
};
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
